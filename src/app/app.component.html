<main class="page-shell">
  <section class="app-card">
    <p class="eyebrow">Simple Azure Container App Demo</p>
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ subtitle }}</p>

    <button type="button" (click)="callApp()" [disabled]="loading">
      {{ loading ? 'Calling...' : 'Call App' }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="response-card">
      <p class="response-label">Response</p>
      <pre>{{ response }}</pre>
    </div>
  </section>
</main>
